# ============================================================
# uedrlhf — Unified Configuration
# ============================================================

# === Environment ===
# Which environment to generate/render.
# Options: "jaxnav", "xland_minigrid"
environment: xland_minigrid

# === LLM Provider ===
# Which LLM API to use for feedback collection.
# Options: "gemini", "openwebui"
llm_provider: openwebui

# === Data Strategy ===
# Options: "v1" or "v2". Toggles pipeline pathing for databases and images.
data_version: "v2"


# === Feedback Type ===
# Options:
#   - difficulty_feedback   : "Which environment looks harder?"
#   - learnability_feedback : "Which environment looks more learnable?"
feedback_type: difficulty_feedback

# Only used when feedback_type is learnability_feedback
# Options:
#   - dijkstra : pair environments by Dijkstra path length bins
#   - param    : pair environments by configuration parameter bins (fill, distance)
learnability_mode: dijkstra

# === Dataset Compilation ===
# Which feedback source to compile into a training dataset
# Options:
#   "human"             → compiles from human_preference_pairs table
#   "gemini-2.5-flash"  → compiles from gemini_2_5_flash table
#   "gemini-2.5-pro"    → compiles from gemini_2_5_pro table
#   (any model name you ran llm_feedback.py with)
feedback_source: "gemma4:e2b" # only used at compile time

# === Per-Environment Settings ===
jaxnav:
  num_agents: 1
  map_height: 11.0
  map_width: 11.0
  cell_size: 1.0
  img_size: 120
  resize: [64, 64]
  only_solvable: true

xland_minigrid:
  env_id: "MiniGrid-BlockedUnlockPickUp"
  tile_size: 32
  view_size: 7
  resize: [88, 48]

# === Per-Provider Settings ===
gemini:
  model: "gemini-2.5-flash"
  api_key_env: "GEMINI_API_KEY"

openwebui:
  model: "gemma4:e2b"
  api_key_env: "OPENWEBUI_API_KEY"
  base_url: "https://llm.mobile.ifi.lmu.de"

# === Training ===
training:
  dataset_path: data/difficulty/compiled_gemini_2_5_flash_20k
  batch_size: 128
  epochs: 50
  img_size: 9999 #this should be removed
  learning_rate: 0.001
  project_name: "gemma4e2b-direct"
  run_name: 