[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uedrlhf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "jax[cuda12]",
    "flax",
    "optax",
    "gymnax",
    "jaxued",
    "pytest>=9.0.2",
    "brax>=0.14.1",
    "jaxmarl",
    "fastapi[standard]>=0.135.1",
    "sqlalchemy>=2.0.48",
    "tensorflow>=2.21.0",
    "datasets>=4.8.4",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "nvidia-cudnn-cu12>=9.20.0.48",
    "torch",
    "torchvision",
    "numpy>=2.4.4",
    "craftax>=1.6.1",
    "xminigrid>=0.9.3",
    "requests",
    "google-cloud-storage>=3.13.0",
]

[[tool.uv.index]]
name = "jax-cuda"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.uv.sources]
jaxlib = { index = "jax-cuda" }
jaxued = { git = "https://github.com/DramaCow/jaxued" }
jaxmarl = { git = "https://github.com/malikdurmus/JaxMARL.git" , branch = "experimental"}
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }


[tool.pytest.ini_options]
# scripts/debug/ holds manual inspection utilities, not a test suite. Several
# are named test_*.py for historical reasons and execute real work at import
# (API calls, environment generation), so keep pytest out of them.
norecursedirs = ["scripts", "archive", "data", "data_v2", "data_v3", "outputs", "wandb", ".venv"]

[tool.setuptools]
packages = ["uedrlhf"]
