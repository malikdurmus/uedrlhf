[project]
name = "uedrlhf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "jax[cuda12]",
    "flax",
    "optax",
    "gymnax",
    "jaxued",
    "pytest>=9.0.2",
    "brax>=0.14.1",
    "jaxmarl",
    "fastapi[standard]>=0.135.1",
    "sqlalchemy>=2.0.48",
    "tensorflow>=2.21.0",
    "datasets>=4.8.4",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[[tool.uv.index]]
name = "jax-cuda"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
explicit = true

[tool.uv.sources]
jaxlib = { index = "jax-cuda" }
jaxued = { git = "https://github.com/DramaCow/jaxued" }
jaxmarl = { git = "https://github.com/malikdurmus/JaxMARL.git"}

[tool.setuptools]
packages = ["standalone_jaxnav", "tests_jaxnav"]
